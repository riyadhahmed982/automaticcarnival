
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06040c; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --text:#f3effc; --muted:#8e88a6; --gold1:#f8cd7c; --gold2:#eea45e; --teal:#3de3c6; --pink:#ff6b8a; --violet:#7c5cff;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif; --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100%}
body{background:
  radial-gradient(120% 60% at 0% 0%,rgba(98,56,210,.55),transparent 60%),
  radial-gradient(90% 50% at 100% 100%,rgba(140,40,70,.35),transparent 60%),var(--bg);
  background-attachment:fixed;padding-bottom:120px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand{font-family:var(--serif);font-style:italic;font-weight:800;font-size:26px;flex:1;background:linear-gradient(90deg,#fff,#d9c9ff 55%,var(--gold1));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(10,8,20,.7);border-radius:999px;padding:11px 16px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--gold1)}
.ico{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,20,.7);display:grid;place-items:center;font-size:18px;color:var(--text)}
.av{width:46px;height:46px;border-radius:50%;padding:2px;background:conic-gradient(var(--gold1),var(--pink),var(--violet),var(--teal),var(--gold1));flex:none}
.av img,.av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#1a1330;font-weight:800}
h1{font-size:40px;line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-1.2px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold1),#ff8fb0,#b99bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:24px;margin:30px 0 14px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:15px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px}
.search{display:flex;align-items:center;gap:12px;padding:3px;border-radius:999px;background:linear-gradient(90deg,#33e0c8,#ff6b9a 70%,#8a6bff);margin-bottom:6px}
.search div{flex:1;display:flex;align-items:center;gap:12px;background:#0a0814;border-radius:999px;padding:15px 20px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:10px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;font-family:inherit}
.chip.on{background:#f3efe6;color:#14101f;border-color:transparent}
.seg{display:flex;padding:8px;border:1px solid var(--line);border-radius:22px;background:rgba(10,8,20,.6);gap:6px;margin-bottom:16px}
.seg button{flex:1;border:0;padding:15px;border-radius:15px;background:none;color:var(--muted);font:inherit;font-weight:800;font-size:16px}
.seg button.on{background:linear-gradient(90deg,var(--gold1),var(--gold2));color:#2a1b06}
.btn{border:0;border-radius:20px;padding:16px 20px;font:inherit;font-weight:800;font-size:17px;color:#2a1b06;background:linear-gradient(90deg,var(--gold1),var(--gold2));box-shadow:0 10px 30px rgba(238,164,94,.25);width:100%}
.btn.sm{width:auto;padding:12px 22px;border-radius:16px;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);box-shadow:none}
.cats{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.cat{flex:none;width:150px;height:150px;border-radius:30px;background:linear-gradient(145deg,#5b3df0,#7a62ff);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;border:0;text-align:left;color:#fff;font-family:inherit}
.cat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.cat b{font-family:var(--serif);font-style:italic;font-size:22px}.cat small{opacity:.8;font-size:14px;margin-top:4px}
.file{border:1px solid rgba(226,170,80,.45);border-radius:28px;padding:18px;margin-bottom:16px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 0 30px rgba(226,170,80,.08)}
.file .row{display:flex;gap:14px}
.ext{flex:none;width:66px;height:80px;border-radius:14px 22px 14px 14px;background:rgba(210,150,90,.18);color:var(--gold1);display:grid;place-items:center;font-weight:800;font-size:15px}
.ft{flex:1;min-width:0}
.ft b{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.15;display:block;word-break:break-word}
.by{color:var(--muted);margin-top:4px;font-size:14px}.by strong{color:var(--text);font-family:var(--serif);font-style:italic}
.ver{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#2f80ff;color:#fff;font-size:11px;margin-left:4px;vertical-align:1px}
.meta{display:flex;gap:12px;color:var(--muted);font-size:14px;margin-top:8px;flex-wrap:wrap;align-items:center}
.desc{color:var(--muted);margin:8px 0 0;font-size:14px}
.price{flex:none;display:flex;flex-direction:column;gap:8px;width:92px}
.price button{border:1px solid rgba(226,170,80,.5);background:rgba(226,170,80,.13);color:var(--gold1);border-radius:16px;padding:12px 6px;font:inherit;font-weight:800;font-size:16px}
.price button.own{background:rgba(61,227,198,.12);border-color:rgba(61,227,198,.5);color:var(--teal)}
.acts{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.act{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:11px 17px;border-radius:999px;font:inherit;font-weight:700;font-size:14px}
.act.on{color:var(--pink);border-color:rgba(255,107,138,.5)}
.act.link{color:var(--teal);border-color:rgba(61,227,198,.4)}.act.tut{color:var(--pink);border-color:rgba(255,107,138,.4)}
.row2{display:flex;align-items:center;gap:14px}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{padding:18px;border-radius:26px;border:1px solid var(--line);background:var(--card)}
.tile i{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;font-style:normal;font-size:22px;margin-bottom:22px}
.tile b{font-size:34px;display:block}.tile span{color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:12px}
.mi{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:24px;background:var(--card);width:100%;text-align:left;color:var(--text);font-family:inherit}
.mi i{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:22px;background:rgba(124,92,255,.2)}
.mi b{display:block;font-size:18px}.mi small{color:var(--muted);font-size:14px}.mi s{margin-left:auto;color:var(--muted);text-decoration:none;font-size:20px}
.soon{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold1);border:1px solid rgba(226,170,80,.4);border-radius:999px;padding:4px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pack{padding:20px 12px;text-align:center;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.04);color:var(--text);font-family:inherit}
.pack b{font-size:34px;display:block;letter-spacing:-1px}.pack small{color:var(--muted);display:block}.pack em{font-style:normal;color:var(--teal);font-size:14px;font-weight:700;display:block;min-height:18px}.pack strong{color:var(--gold1);font-size:19px;display:block;margin-top:6px}
.pack.hot{border-color:rgba(226,170,80,.55)}
.vip{border:1px solid rgba(226,170,80,.5);border-radius:28px;padding:22px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(60,30,110,.35))}
.vip ul{list-style:none;padding:0;margin:16px 0;display:grid;gap:12px;font-size:16px}
.vip .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vip .opts button{border:0;border-radius:20px;padding:18px 8px;background:linear-gradient(90deg,var(--gold1),var(--gold2));color:#2a1b06;font:inherit;font-weight:800;font-size:19px}
.vip .opts small{display:block;font-size:17px;margin-top:6px}
.input{display:flex;gap:12px;padding:18px;border:1px solid var(--line);border-radius:26px;background:var(--card)}
.input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06);color:var(--text);padding:15px 18px;font:inherit;font-size:17px;outline:0;text-transform:uppercase}
.hist{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:24px;background:var(--card);margin-bottom:12px}
.hist b{display:block;font-size:17px}.hist small{color:var(--muted)}
.pos{color:var(--teal);font-weight:800}.neg{color:var(--pink);font-weight:800}
.hero{text-align:center;padding:26px 16px}
.avbig{width:128px;height:128px;margin:0 auto 14px;border-radius:50%;padding:4px;background:conic-gradient(var(--gold1),var(--pink),var(--violet),var(--teal),var(--gold1))}
.avbig img,.avbig span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#1a1330;font-size:44px;font-weight:800}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0}
.bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--gold1))}
.empty{text-align:center;padding:50px 10px}.empty b{display:block;font-size:20px;margin-bottom:6px}.empty span{color:var(--muted)}
.cta{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid rgba(255,107,138,.3);border-radius:26px;background:rgba(255,107,138,.07);width:100%;text-align:left;color:var(--text);font-family:inherit;margin-top:20px}
.cta i{flex:none;width:60px;height:60px;border-radius:18px;background:rgba(255,107,138,.14);display:grid;place-items:center;font-style:normal;font-size:24px}
.cta b{font-size:19px;display:block}.cta small{color:var(--muted);font-size:15px}
.streak{display:flex;gap:10px;margin-top:14px}.streak span{flex:1;text-align:center;padding:12px 0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:700;font-size:14px}.streak span.done{color:var(--gold1);background:rgba(226,170,80,.15)}
.copybox{display:flex;align-items:center;gap:10px;border:1.5px dashed rgba(226,170,80,.5);border-radius:22px;padding:10px 10px 10px 18px;margin:14px 0}
.copybox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold1);font-weight:600}
.back{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;margin-bottom:18px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));display:flex;padding:8px;border-radius:34px;background:rgba(14,11,26,.94);border:1px solid var(--line);backdrop-filter:blur(16px);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0;border-radius:26px;font:inherit;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button span{font-size:22px;line-height:1}
nav button.on{background:rgba(255,255,255,.09);color:var(--text)}
nav button.on span{filter:sepia(1) saturate(4) hue-rotate(5deg)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#f3efe6;color:#14101f;padding:13px 20px;border-radius:16px;font-weight:700;z-index:30;transition:transform .25s;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:520px;background:#120d22;border:1px solid var(--line);border-radius:30px 30px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.stars{display:flex;gap:8px;justify-content:center;margin:18px 0}.stars button{background:none;border:0;font-size:38px;color:#4a4560;padding:0}.stars button.on{color:var(--gold1)}
.load{color:var(--muted);text-align:center;padding:60px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="load">Loading…</div></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#06040c'); tg.setBackgroundColor('#06040c'); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, tab = 'home', sub = null, fq = '', fcat = '', fsaved = 0, fmode = 'library', tfilter = 'all', toastT;

async function api(path, body) {
  const r = await fetch('/api' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type': 'application/json', 'X-Init-Data': (tg && tg.initData) || ''},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!r.ok) { let m = 'Something went wrong. Try again.'; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function confirmBox(msg, ok) { tg && tg.showConfirm ? tg.showConfirm(msg, y => y && ok()) : (confirm(msg) && ok()); }
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const num = n => Number(n).toLocaleString('en-US');
function ago(ts) { const s = Date.now() / 1000 - ts; if (s < 86400) return 'today'; const d = Math.floor(s / 86400); return d < 30 ? d + 'd ago' : Math.floor(d / 30) + 'mo ago'; }
const openLink = u => (tg && u.startsWith('https://t.me') ? tg.openTelegramLink(u) : (tg ? tg.openLink(u) : window.open(u)));

function topbar() {
  const p = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.photo_url;
  return `<div class="top"><div class="brand">${esc(me.brand)}</div>
    <div class="pill"><i class="dot"></i>${num(me.credits)} <span style="color:var(--muted);font-weight:600">cr</span></div>
    <button class="ico" data-a="bell">🔔</button>
    <div class="av">${p ? `<img src="${esc(p)}" alt="">` : `<span>${esc((me.name || '?')[0])}</span>`}</div></div>`;
}

function fileCard(f) {
  const l = f.links || {};
  const star = f.rating ? `<span style="color:var(--gold1)">★ ${f.rating} <small style="color:var(--muted)">(${f.rating_count})</small></span>` : '';
  return `<div class="file"><div class="row"><div class="ext">${esc(f.category)}</div>
    <div class="ft"><b>${esc(f.title)}</b><div class="by">by <strong>${esc(f.uploader)}</strong><span class="ver">✓</span></div>
    <div class="meta">${star}<span>${fmtSize(f.size)}</span><span>↓ ${f.downloads}</span><span>${ago(f.created)}</span></div>
    ${f.description ? `<p class="desc">${esc(f.description)}</p>` : ''}</div>
    <div class="price">
      ${f.owned ? `<button class="own" data-a="get" data-id="${f.id}">Get again</button>` :
        `<button data-a="get" data-id="${f.id}">${f.price === 0 ? 'Free' : num(f.price) + ' cr'}</button><button data-a="stars" data-id="${f.id}">⭐ ${num(f.stars)}</button>`}
    </div></div>
    <div class="acts">
      ${l.tutorial ? `<button class="act tut" data-a="link" data-u="${esc(l.tutorial)}">▶ Tutorial</button>` : ''}
      ${l.demo ? `<button class="act link" data-a="link" data-u="${esc(l.demo)}">🌐 Live demo</button>` : ''}
      ${l.bot ? `<button class="act link" data-a="link" data-u="${esc(l.bot)}">🤖 Try the bot</button>` : ''}
      <button class="act ${f.saved ? 'on' : ''}" data-a="save" data-id="${f.id}">${f.saved ? '♥' : '♡'} Save</button>
      <button class="act" data-a="rate" data-id="${f.id}">★ Rate</button>
      <button class="act" data-a="report" data-id="${f.id}">⚑ Report</button>
    </div></div>`;
}

async function pageHome() {
  const h = await api('/home'), d = me.daily;
  const nxt = d.next_in ? `${d.next_in} more day${d.next_in > 1 ? 's' : ''} for +${d.next_bonus} bonus credits` : 'Max streak reached';
  return `<h1>Find any file,<br><em>in seconds.</em></h1><p class="sub">Every file in the store, searchable in one place.</p>
  <div class="search"><div>🔍<input id="hs" placeholder="Search files…" enterkeyhint="search"></div></div>
  <h2>Categories <a data-a="tab" data-t="files">See all</a></h2>
  ${h.categories.length ? `<div class="cats">${h.categories.map(c => `<button class="cat" data-a="cat" data-c="${esc(c.name)}">📱<div style="flex:1"></div><b>${esc(c.name)}</b><small>${c.count} file${c.count > 1 ? 's' : ''}</small></button>`).join('')}</div>` : `<div class="card empty"><b>No files yet</b><span>New files will show up here.</span></div>`}
  <h2>Trending <a data-a="tab" data-t="files">More</a></h2>
  ${h.trending.map(fileCard).join('') || ''}
  <h2>Daily reward</h2>
  <div class="card"><div class="row2"><div style="flex:1"><b style="font-size:21px">${d.claimed ? 'Come back tomorrow' : 'Claim +' + d.amount + ' credits'}</b>
  <div style="color:var(--muted)">${d.claimed ? 'You already claimed today' : 'Your reward is ready'}</div></div>
  ${d.claimed ? `<button class="btn sm" style="background:var(--teal)" disabled>✓ Done</button>` : `<button class="btn sm" data-a="daily">Claim</button>`}</div>
  <div style="border-top:1px solid var(--line);margin:18px 0"></div>
  <div class="row2"><span style="font-size:42px">🔥</span><b style="font-size:34px">${d.streak}</b><div><b style="font-size:19px">${d.streak}-day streak</b><div style="color:var(--muted)">${nxt}</div></div></div>
  <div class="streak">${d.steps.map(s => `<span class="${d.streak >= s ? 'done' : ''}">${s}d</span>`).join('')}</div></div>
  <button class="cta" data-a="tab" data-t="tasks"><i>✅</i><div><b>Running low on credits?</b><small>Finish tasks and earn free credits</small></div></button>`;
}

async function pageFiles() {
  const r = await api(`/files?q_=${encodeURIComponent(fq)}&cat=${encodeURIComponent(fcat)}&saved=${fsaved}`);
  const list = fmode === 'library'
    ? (r.files.map(fileCard).join('') || `<div class="empty"><b>No files found</b><span>Try another search, or request the file below.</span></div>`)
    : `<div class="empty"><b>No listings yet</b><span>Files sold by members will appear here.</span></div>`;
  return `<h1 style="font-size:38px">Files</h1>
  <div class="seg"><button class="${fmode === 'library' ? 'on' : ''}" data-a="mode" data-m="library">Library</button><button class="${fmode === 'market' ? 'on' : ''}" data-a="mode" data-m="market">Marketplace</button></div>
  <div class="search"><div>🔍<input id="fs" placeholder="Search fil
